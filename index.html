<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BatonPass Lite</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0d6b5c">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231f;--mut:#5d6f69;--line:#d5dcd9;--ac:#0d6b5c;--warn:#b45309;--bad:#b42318;--ok:#0f7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#18231f;--ink:#e8f0ed;--mut:#9bb0a9;--line:#2c3b36;--ac:#3cc7ae;--warn:#f0a43a;--bad:#ff7b6e;--ok:#4cd28a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:12px}h1{font-size:20px;margin:8px 0}h2{font-size:16px;margin:0 0 6px}h3{font-size:15px;margin:14px 0 4px;color:var(--mut)}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
input,select,button{font:inherit;width:100%;padding:11px;margin:4px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--ac);color:var(--bg);border:0;font-weight:600;cursor:pointer}button.s{background:none;color:var(--ac);border:1px solid var(--ac)}button.d{background:none;color:var(--bad);border:1px solid var(--bad)}button:disabled{background:var(--line);color:var(--mut);border-color:var(--line);cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:1px}
nav{display:flex;gap:6px}nav button{width:auto;flex:1;padding:9px 4px}.row{display:flex;gap:8px;align-items:center}.row>*{margin:4px 0}.row button{width:auto}
.o{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.ok{color:var(--ok)}.bad{color:var(--bad)}.m{color:var(--mut);font-size:14px}
.otp{font-size:36px;letter-spacing:6px;text-align:center;font-weight:700;color:var(--ac)}#err{color:var(--bad);min-height:22px;font-weight:600}.note{background:var(--ac);color:var(--bg);padding:8px 12px;border-radius:8px;font-weight:600;margin:8px 0}
video{width:100%;max-height:35vh;border-radius:8px;background:#000}.ov{position:fixed;inset:10px;z-index:9;overflow:auto}summary{cursor:pointer;font-weight:600}
</style></head><body><main id="app"></main>
<script>addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.innerHTML.trim())a.innerHTML='<p style="color:#b42318;padding:12px;font-weight:600">Page error: '+e.message+' (line '+e.lineno+'). Check the API line in index.html.</p>'})</script>
<script>
const VER='v3';
const API='https://script.google.com/macros/s/AKfycbz0gGp6oeT3FDI-NbqtrR-77yxlop0j1yibXw0A5ya6cZC1n--J0K2QzxmrWQGqYBc5/exec';
const ST={Created:'Draft',Transferred:'Sent',Receiving:'Receiving','OTP generated':'OTP ready',Locked:'Locked, contact admin',Closed:'Completed',Rejected:'Rejected'};
let T=localStorage.t||'',me,tab='o',data={c:{o:0,d:0,r:0},out:[],inb:[]},hist={d:null,r:null},done={},op={},msg='',note='',showNew=false,seen=null,ip,timer,busy=0,qt,Q={},last='',P=Promise.resolve(),pend=0;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),opt=(a,f)=>a.map(f).join('');
const fmt=t=>t?new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
async function api(a,d={}){if(API.indexOf('PASTE')==0){msg='Web app URL is not set in index.html (API line).';return null}busy++;try{const r=await fetch(API,{method:'POST',body:JSON.stringify({a,t:T,...d})}),j=await r.json();if(j.err){if(j.err=='SESSION'){logout();throw 0}msg=j.err;return null}msg='';if(j.list&&pend<=1&&!Object.keys(Q).length)setData(j.list);return j}catch(e){if(e!==0)msg='Network error ('+(e&&e.message||e)+'). Check connection and the web app URL.';return null}finally{busy--}}
function setData(l){if(seen){const nw=l.inb.filter(b=>!seen.has(b.id));if(nw.length){navigator.vibrate&&navigator.vibrate([250,120,250]);note='New batch received from '+nw[0].from;setTimeout(()=>{note='';draw()},8000)}}seen=new Set(l.inb.map(b=>b.id));data=l;last=JSON.stringify(l)}
function logout(){T='';delete localStorage.t;me=null;seen=null;clearInterval(timer);login()}
function login(){$('#app').innerHTML=`<h1>BatonPass Lite <span class="m">${VER}</span></h1><div class="c"><input id="u" placeholder="User ID" autocomplete="username"><input id="p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><button id="go">Log in</button><div id="err">${esc(msg)}</div></div>`;
$('#go').onclick=async()=>{$('#go').disabled=true;$('#go').textContent='Logging in…';const r=await api('login',{uid:$('#u').value.trim(),pin:$('#p').value});if(!r)return login();T=r.t;localStorage.t=T;r.must?pin():start(r)}}
function pin(){$('#app').innerHTML=`<h1>Set a new PIN</h1><div class="c"><p class="m">Choose a 4 to 6 digit PIN. You must change it before continuing.</p><input id="n" type="password" inputmode="numeric" placeholder="New PIN"><button id="go">Save PIN</button><div id="err">${esc(msg)}</div></div>`;
$('#go').onclick=async()=>{if(await api('setPin',{pin:$('#n').value}))inst();else pin()}}
function inst(){if(matchMedia('(display-mode:standalone)').matches)return start();$('#app').innerHTML=`<h1>Add to home screen</h1><div class="c"><p class="m">Install the app for one-tap access.</p><button id="i">Install app</button><button class="s" id="k">Skip</button></div>`;
$('#i').onclick=async()=>{if(ip){ip.prompt();await ip.userChoice;start()}else{alert(/iphone|ipad/i.test(navigator.userAgent)?'Tap the Share icon, then Add to Home Screen.':'Open the browser menu and choose Install app or Add to Home screen.');start()}};$('#k').onclick=start}
async function start(r){r=r&&r.u?r:await api('me');if(!r)return login();me=r;if(r.list)setData(r.list);tab='o';draw();clearInterval(timer);timer=setInterval(poll,10000)}
async function poll(){if(busy||pend||document.hidden||!me||Object.keys(Q).length)return;const r=await api('list');if(r){const s=JSON.stringify(r);if(s!=last){const cc=data.c.d+'|'+data.c.r;setData(r);if(tab!='o'&&cc!=r.c.d+'|'+r.c.r)loadHist(tab);draw()}}}
async function loadHist(k){const r=await api('hist',{k});if(r){hist[k]=r.items;draw()}}
function keep(){const s={};document.querySelectorAll('#app input,#app select').forEach(e=>{if(e.id)s[e.id]=e.value});const a=document.activeElement;return{s,f:a&&a.id,c:a&&a.selectionStart}}
function put(k){for(const id in k.s){const e=document.getElementById(id);if(e&&e.value!=k.s[id])e.value=k.s[id]}}
function draw(){if(!me)return;const k=keep(),u=me.u,c=data.c,tabs=[['o','Ongoing',c.o],['d','Completed',c.d],['r','Rejected',c.r]];
let h=`<div class="row"><h1 style="flex:1">${esc(u.name)} <span class="m">${u.role}, ${esc(u.city)}</span></h1><button class="s" onclick="logout()">Log out</button></div><nav>${tabs.map(t=>`<button class="${tab==t[0]?'':'s'}" onclick="tab='${t[0]}';if(tab!='o')loadHist(tab);draw()">${t[1]} (${t[2]})</button>`).join('')}</nav>${note?`<div class="note">${esc(note)}</div>`:''}<div id="err">${esc(msg)}</div>${pend?'<div class="m">Saving…</div>':''}`;
h+=(tab=='o'?ongoing():histView(tab))+`<p class="m">BatonPass Lite ${VER}</p>`;$('#app').innerHTML=h;put(k);if(tab=='o'&&showNew)formBind();put(k);
if(k.f){const e=document.getElementById(k.f);if(e){e.focus();try{e.setSelectionRange(k.c,k.c)}catch(_){}}}}
function ongoing(){return `<button class="${showNew?'s':''}" onclick="showNew=!showNew;draw()">${showNew?'Close':'+ New handover'}</button>${showNew?newForm():''}
<h3>Inbox (${data.inb.length})</h3>${data.inb.map(inCard).join('')||'<p class="m c">No incoming handovers.</p>'}<h3>My transfers (${data.out.length})</h3>${data.out.map(outCard).join('')||'<p class="m c">No ongoing transfers.</p>'}`}
function newForm(){const u=me.u;return `<div class="c" id="nf"><h2>New handover</h2><div class="m">Connector (sender)</div><div class="o"><span>${esc(u.name)}</span><span class="m">${u.role}</span></div><label class="m">Receiver role</label><select id="rr"><option value="nurse">Nurse</option><option value="lastmile">Lastmile</option><option value="runner">Runner</option></select><label class="m">Receiver</label><select id="rv"></select><button id="mk">Create batch</button></div>`}
function formBind(){const fill=()=>{const a=me.people.filter(p=>p.role==$('#rr').value);$('#rv').innerHTML=a.length?opt(a,p=>`<option value="${p.id}">${esc(p.name)}</option>`):'<option value="">No one available in your city</option>'};$('#rr').onchange=fill;fill();
$('#mk').onclick=()=>{const rv=$('#rv').value;if(!rv)return alert('No one available in your city for that role');const id='B'+Date.now()+Math.floor(100+Math.random()*900),R=me.people.find(p=>p.id==rv);
data.out.unshift({id,type:'DIRECT',leg:1,status:'Created',created:new Date().toISOString(),from:me.u.name,to:R.name,fin:'',orders:[]});data.c.o++;showNew=false;
ser(async()=>{if(!await api('create',{id,recv:rv})){data.out=data.out.filter(b=>b.id!=id);data.c.o--}})}}
function outCard(b){const c=b.status=='Created',d=done[b.id],n=b.orders.length,sc=b.orders.filter(o=>o.rs).length,otp=b.status=='OTP generated';
return `<div class="c"><h2>To ${esc(b.to)}</h2><div class="m">${ST[b.status]} · ${fmt(b.created)}</div><p class="m">${c?n+' scanned':sc+' of '+n+' received'}</p>${b.orders.map(o=>`<div class="o"><span>${esc(o.id)}</span>${c?`<a href="#" onclick="rm('${b.id}','${esc(o.id)}');return false">Remove</a>`:o.rs?'<span class="ok">received</span>':''}</div>`).join('')||'<p class="m">No orders yet.</p>'}
${c?`<div class="row"><input id="o${b.id}" placeholder="Order ID" ${d?'disabled':''} onkeydown="if(event.key=='Enter')typed('a','${b.id}')"><button class="s" ${d?'disabled':''} onclick="scan('a','${b.id}')">Scan</button><button ${d?'disabled':''} onclick="typed('a','${b.id}')">Add</button></div>
<button ${n&&!d?'':'disabled'} onclick="if(confirm('Are you sure all orders are scanned for handover?')){done['${b.id}']=1;draw()}">Done scanning</button><button ${d?'':'disabled'} onclick="xfer('${b.id}')">Transfer orders</button>${d?`<button class="s" onclick="delete done['${b.id}'];draw()">Scan more</button>`:''}<button class="d" onclick="if(confirm('Discard this batch?'))go('reject',{b:'${b.id}'})">Discard batch</button>`
:`<div class="row"><input id="p${b.id}" inputmode="numeric" placeholder="Handover OTP" ${otp?'':'disabled'}><button ${otp?'':'disabled'} onclick="go('verifyOtp',{b:'${b.id}',otp:$('#p${b.id}').value})">Enter handover OTP</button></div>`}</div>`}
function inCard(b){const n=b.orders.length,sc=b.orders.filter(o=>o.rs).length,scanning=b.status=='Transferred'||b.status=='Receiving';return `<div class="c"><h2>From ${esc(b.from)}</h2><div class="m">${ST[b.status]} · ${sc} of ${n} scanned</div>${b.orders.map(o=>`<div class="o"><span>${esc(o.id)}</span><span class="${o.rs?'ok':'m'}">${o.rs?'scanned':'pending'}</span></div>`).join('')}
${scanning?`<div class="row"><input id="r${b.id}" placeholder="Order ID" onkeydown="if(event.key=='Enter')typed('r','${b.id}')"><button class="s" onclick="scan('r','${b.id}')">Scan</button><button onclick="typed('r','${b.id}')">Add</button></div>`:''}
${b.otp?`<div class="otp">${b.otp}</div><p class="m">Share this OTP with ${esc(b.from)}. Valid 10 minutes.</p>`:''}<button ${sc==n&&n&&b.status!='Locked'?'':'disabled'} onclick="go('genOtp',{b:'${b.id}'})">${b.otp?'New OTP':'Generate OTP'}</button>${sc<n?'<p class="m">Scan every order, or reject the batch.</p>':''}
<button class="d" onclick="if(confirm('Reject this batch? The whole batch will be stuck and the sender must create it again.'))go('reject',{b:'${b.id}'})">Reject batch</button></div>`}
function histView(k){const a=hist[k];if(!a)return '<p class="m c">Loading…</p>';return `<p class="m">Batches created in the last 31 days.</p>`+(a.map(b=>`<details class="c" ${op[b.id]?'open':''} ontoggle="op['${b.id}']=this.open"><summary>${esc(b.from)} → ${esc(b.to)} · ${b.orders.length} orders<div class="m">${fmt(k=='d'?b.closed:b.rejected)}</div></summary><div class="m">Created ${fmt(b.created)}</div>${b.orders.map(o=>`<div class="o"><span>${esc(o.id)}</span><span class="${o.rs?'ok':'m'}">${o.rs?'received':'not scanned'}</span></div>`).join('')}</details>`).join('')||'<p class="m c">Nothing here yet.</p>')}
function ser(fn){pend++;draw();P=P.then(fn).catch(()=>{}).finally(()=>{pend--;if(!pend){last='';draw()}});return P}
function go(a,d){return ser(()=>api(a,d))}
function xfer(b){const x=data.out.find(y=>y.id==b);if(x){x.status='Transferred';delete done[b]}ser(async()=>{if(!await api('transfer',{b})&&x)x.status='Created'})}
function rm(b,o){const x=data.out.find(y=>y.id==b);if(x)x.orders=x.orders.filter(y=>y.id!=o);ser(async()=>{if(!await api('removeOrder',{b,order:o}))setTimeout(poll,300)})}
/* scanning updates the screen instantly and saves to the sheet in batches in the background */
function addLocal(b,id){id=String(id).trim();if(!id)return{ok:0,msg:'Enter an order ID'};const x=data.out.find(y=>y.id==b);if(!x)return{ok:0,msg:'Batch not found'};if(x.orders.some(o=>o.id==id))return{ok:0,msg:'Already added'};x.orders.push({id,rs:false});queue('addOrders',b,id);return{ok:1}}
function recvLocal(b,id){id=String(id).trim();const x=data.inb.find(y=>y.id==b),o=x&&x.orders.find(o=>o.id==id);if(!o)return{ok:0,msg:'Not in this batch'};if(o.rs)return{ok:1,msg:'Already scanned'};o.rs=true;queue('recvScans',b,id);return{ok:1}}
function queue(a,b,id){const k=a+b;(Q[k]=Q[k]||{a,b,ids:[]}).ids.push(id);clearTimeout(qt);qt=setTimeout(flush,500)}
function flush(){const J=Q;Q={};ser(async()=>{for(const k of Object.keys(J)){const q=J[k],r=await api(q.a,{b:q.b,orders:q.ids}),bad=r?(r.fail||[]).map(f=>f.order):q.ids;
if(bad.length){const bt=(q.a=='addOrders'?data.out:data.inb).find(y=>y.id==q.b);if(bt){if(q.a=='addOrders')bt.orders=bt.orders.filter(o=>bad.indexOf(o.id)<0);else bt.orders.forEach(o=>{if(bad.indexOf(o.id)>=0)o.rs=false})}if(r)msg=r.fail.map(f=>f.order+': '+f.err).join('; ')}}})}
function typed(kind,b){const i=document.getElementById((kind=='a'?'o':'r')+b),x=kind=='a'?addLocal(b,i.value):recvLocal(b,i.value);if(x.ok)i.value='';else msg=x.msg;if(x.ok)msg='';draw()}
async function scan(kind,b){if(!('BarcodeDetector' in window))return alert('Camera scan is not supported in this browser. Type the order ID.');
let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return alert('Allow camera access to scan.')}
const d=document.createElement('div');d.className='c ov';d.innerHTML='<video autoplay playsinline muted></video><h2 id="sh"></h2><button id="sd">Done</button><div id="sl"></div>';document.body.append(d);
const v=d.querySelector('video');v.srcObject=s;const det=new BarcodeDetector(),seenC={},list=[];let on=1;
const show=()=>{const bt=(kind=='a'?data.out:data.inb).find(y=>y.id==b),n=bt?bt.orders.length:0,sc=bt?bt.orders.filter(o=>o.rs).length:0;d.querySelector('#sh').textContent=kind=='a'?n+' scanned':sc+' of '+n+' scanned';
d.querySelector('#sl').innerHTML=list.map(x=>`<div class="o"><span>${esc(x.id)}</span><span class="${x.ok?'ok':'bad'}">${x.ok?(x.msg||'✓'):esc(x.msg)}</span></div>`).join('')};
const stop=()=>{on=0;s.getTracks().forEach(t=>t.stop());d.remove();draw()};d.querySelector('#sd').onclick=stop;show();
(async function L(){if(!on)return;try{for(const c of await det.detect(v)){const id=c.rawValue;if(seenC[id]&&Date.now()-seenC[id]<4000)continue;seenC[id]=Date.now();const x=kind=='a'?addLocal(b,id):recvLocal(b,id);list.unshift({id,...x});navigator.vibrate&&navigator.vibrate(x.ok?60:[80,60,80]);show()}}catch(e){}setTimeout(L,250)})()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
T?start():login();
</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BatonPass</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0d6b5c">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231f;--mut:#5d6f69;--line:#d5dcd9;--ac:#0d6b5c;--warn:#b45309;--bad:#b42318;--ok:#0f7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#18231f;--ink:#e8f0ed;--mut:#9bb0a9;--line:#2c3b36;--ac:#3cc7ae;--warn:#f0a43a;--bad:#ff7b6e;--ok:#4cd28a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:12px}h1{font-size:20px;margin:8px 0}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
input,select,button{font:inherit;width:100%;padding:11px;margin:4px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--ac);color:var(--bg);border:0;font-weight:600;cursor:pointer}button.s{background:none;color:var(--ac);border:1px solid var(--ac)}button:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:1px}
nav{display:flex;gap:6px}nav button{width:auto;flex:1}.row{display:flex;gap:8px;align-items:center}.row>*{margin:4px 0}.row button{width:auto}
.o{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.ok{color:var(--ok)}.bad{color:var(--bad)}.m{color:var(--mut);font-size:14px}
.otp{font-size:36px;letter-spacing:6px;text-align:center;font-weight:700;color:var(--ac)}#err{color:var(--bad);min-height:22px;font-weight:600}
video{width:100%;max-height:35vh;border-radius:8px;background:#000}.ov{position:fixed;inset:10px;z-index:9;overflow:auto}
</style></head><body><main id="app"></main>
<script>
const API='PASTE_APPS_SCRIPT_WEB_APP_URL';
const TL={LM_NURSE:['Lastmile to Nurse',['lastmile','nurse']],LM_RUNNER_NURSE:['Lastmile to Runner to Nurse',['lastmile','runner','nurse']],NURSE_LM:['Nurse to Lastmile',['nurse','lastmile']],NURSE_RUNNER_LM:['Nurse to Runner to Lastmile',['nurse','runner','lastmile']]};
let T=localStorage.t||'',me,tab='h',data={out:[],inb:[]},done={},msg='',ip,timer,busy=0,qt,Q={},last='';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),opt=(a,f)=>a.map(f).join('');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
async function api(a,d={}){if(API.indexOf('PASTE')==0){msg='Web app URL is not set in index.html (API line).';return null}busy++;try{const r=await fetch(API,{method:'POST',body:JSON.stringify({a,t:T,...d})}),j=await r.json();if(j.err){if(j.err=='SESSION'){logout();throw 0}msg=j.err;return null}msg='';if(j.list){data=j.list;last=JSON.stringify(data)}return j}catch(e){if(e!==0)msg='Network error ('+(e&&e.message||e)+'). Check connection and the web app URL.';return null}finally{busy--}}
function logout(){T='';delete localStorage.t;me=null;clearInterval(timer);login()}
function login(){$('#app').innerHTML=`<h1>BatonPass</h1><div class="c"><input id="u" placeholder="User ID" autocomplete="username"><input id="p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><button id="go">Log in</button><div id="err">${esc(msg)}</div></div>`;
$('#go').onclick=async()=>{$('#go').disabled=true;const r=await api('login',{uid:$('#u').value.trim(),pin:$('#p').value});if(!r)return login();T=r.t;localStorage.t=T;r.must?pin():start()}}
function pin(){$('#app').innerHTML=`<h1>Set a new PIN</h1><div class="c"><p class="m">Choose a 4 to 6 digit PIN. You must change it before continuing.</p><input id="n" type="password" inputmode="numeric" placeholder="New PIN"><button id="go">Save PIN</button><div id="err">${esc(msg)}</div></div>`;
$('#go').onclick=async()=>{if(await api('setPin',{pin:$('#n').value}))inst();else pin()}}
function inst(){if(matchMedia('(display-mode:standalone)').matches)return start();$('#app').innerHTML=`<h1>Add to home screen</h1><div class="c"><p class="m">Install the app for one-tap access.</p><button id="i">Install app</button><button class="s" id="k">Skip</button></div>`;
$('#i').onclick=async()=>{if(ip){ip.prompt();await ip.userChoice;start()}else{alert(/iphone|ipad/i.test(navigator.userAgent)?'Tap the Share icon, then Add to Home Screen.':'Open the browser menu and choose Install app or Add to Home screen.');start()}};$('#k').onclick=start}
async function start(){const r=await api('me');if(!r)return login();me=r;if(!r.list)data={out:[],inb:[]};if(r.u.role=='runner')tab='i';draw();timer=setInterval(poll,10000)}
async function poll(){if(busy||document.hidden||!me||Object.keys(Q).length)return;const r=await api('list');if(r){const s=JSON.stringify(r);if(s!=last){last=s;data=r;draw()}}}
function keep(){const s={};document.querySelectorAll('#app input,#app select').forEach(e=>{if(e.id)s[e.id]=e.value});const a=document.activeElement;return{s,f:a&&a.id,c:a&&a.selectionStart}}
function put(k){for(const id in k.s){const e=document.getElementById(id);if(e&&e.value!=k.s[id])e.value=k.s[id]}}
function draw(){if(!me)return;const k=keep(),u=me.u,tabs=(u.role=='runner'?[]:[['h','Handover']]).concat([['i','Inbox']]).concat(u.role=='nurse'?[['c','Check-in']]:[]);if(u.role=='runner')tabs.splice(1,0,['h','Send on']);
let h=`<div class="row"><h1 style="flex:1">${esc(u.name)} <span class="m">${u.role}, ${esc(u.city)}</span></h1><button class="s" onclick="logout()">Log out</button></div><nav>${tabs.map(t=>`<button class="${tab==t[0]?'':'s'}" onclick="tab='${t[0]}';draw()">${t[1]}${t[0]=='i'&&data.inb.length?' ('+data.inb.length+')':''}</button>`).join('')}</nav><div id="err">${esc(msg)}</div>`;
h+=tab=='h'?outView():tab=='i'?inView():chkView();$('#app').innerHTML=h;put(k);if(tab=='c')chkBind();if(tab=='h')formBind();put(k);
if(k.f){const e=document.getElementById(k.f);if(e){e.focus();try{e.setSelectionRange(k.c,k.c)}catch(_){}}}}
const sp=s=>String(s).split(',').map(x=>x.trim()).filter(Boolean);
const myHubs=()=>{const h=sp(me.u.hubs);return h.length?h:me.hubs};
const inHub=(p,h)=>{const x=sp(p.hubs);return x.length?x.includes(h):p.role=='nurse'};
function formBind(){const f=$('#nf');if(!f)return;const ty=$('#ty'),hb=$('#hb');const fill=()=>{const R=TL[ty.value][1],h=hb.value,ppl=r=>me.people.filter(p=>p.role==r&&inHub(p,h)),mk=a=>a.length?opt(a,p=>`<option value="${p.id}">${esc(p.name)}</option>`):'<option value="">No one tagged to this hub</option>';
const rr=R.length==3?'runner':R[1];$('#rl').textContent='Receiver ('+rr+')';$('#rv').innerHTML=mk(ppl(rr));$('#fnw').style.display=R.length==3?'block':'none';$('#fn').innerHTML=mk(ppl(R[2]||''))};ty.onchange=hb.onchange=()=>{fill();put(keep())};fill();
$('#mk').onclick=async()=>{const R=TL[ty.value][1];if(!$('#rv').value||(R.length==3&&!$('#fn').value))return alert('No one is tagged to this hub for that role');await api('create',{type:ty.value,hub:hb.value,recv:$('#rv').value,fin:R.length==3?$('#fn').value:''});draw()}}
function outView(){const ty=Object.keys(TL).filter(k=>TL[k][1][0]==me.u.role);
let h=ty.length?`<div class="c" id="nf"><h2>New handover</h2><select id="ty">${opt(ty,k=>`<option value="${k}">${TL[k][0]}</option>`)}</select><label class="m">Hub</label><select id="hb">${opt(myHubs(),x=>`<option>${esc(x)}</option>`)}</select><label class="m" id="rl">Receiver</label><select id="rv"></select><div id="fnw"><label class="m">Final receiver</label><select id="fn"></select></div><button id="mk">Create batch</button></div>`:'';
h+=data.out.map(b=>{const c=b.status=='Created',d=done[b.id],n=b.orders.length,sc=b.orders.filter(o=>o.rs).length,otp=b.status=='OTP generated';
return `<div class="c"><h2>${TL[b.type][0]} · leg ${b.leg}</h2><div class="m">To ${esc(b.other)} at ${esc(b.hub)} · ${b.status}</div>${b.stuck?'<div class="m" style="color:var(--warn)">Receiver reported missing orders. Remove the orders not received to continue.</div>':''}
<p class="m">${c?n+' scanned':sc+' of '+n+' received'}</p>${b.orders.map(o=>`<div class="o"><span>${esc(o.id)}</span>${!c&&o.rs?'<span class="ok">received</span>':(c||(b.stuck&&!otp))?`<a href="#" onclick="rm('${b.id}','${esc(o.id)}');return false">Remove</a>`:''}</div>`).join('')||'<p class="m">No orders yet.</p>'}
${c?`<div class="row"><input id="o${b.id}" placeholder="Order ID" ${d?'disabled':''} onkeydown="if(event.key=='Enter')typed('a','${b.id}')"><button class="s" ${d?'disabled':''} onclick="scan('a','${b.id}')">Scan</button><button ${d?'disabled':''} onclick="typed('a','${b.id}')">Add</button></div>
<button ${n&&!d?'':'disabled'} onclick="if(confirm('Are you sure all orders are scanned for handover?')){done['${b.id}']=1;draw()}">Done scanning</button><button ${d?'':'disabled'} onclick="go('transfer',{b:'${b.id}'})">Transfer orders</button>${d?`<button class="s" onclick="delete done['${b.id}'];draw()">Scan more</button>`:''}`
:`<div class="row"><input id="p${b.id}" inputmode="numeric" placeholder="Handover OTP" ${otp?'':'disabled'}><button ${otp?'':'disabled'} onclick="go('verifyOtp',{b:'${b.id}',otp:$('#p${b.id}').value})">Enter handover OTP</button></div>`}</div>`}).join('');return h}
function inView(){return data.inb.map(b=>{const n=b.orders.length,sc=b.orders.filter(o=>o.rs).length;return `<div class="c"><h2>From ${esc(b.other)}</h2><div class="m">${TL[b.type][0]} · ${esc(b.hub)} · ${sc} of ${n} scanned</div>${b.orders.map(o=>`<div class="o"><span>${esc(o.id)}</span><span class="${o.rs?'ok':'m'}">${o.rs?'scanned':'pending'}</span></div>`).join('')}
<div class="row"><input id="r${b.id}" placeholder="Order ID" onkeydown="if(event.key=='Enter')typed('r','${b.id}')"><button class="s" onclick="scan('r','${b.id}')">Scan</button><button onclick="typed('r','${b.id}')">Add</button></div>
${b.otp?`<div class="otp">${b.otp}</div><p class="m">Share this OTP with ${esc(b.other)}. Valid 10 minutes.</p>`:''}${sc<n&&b.status!='OTP generated'?(b.stuck?'<p class="m">Reported. Waiting for the sender to remove the orders not received.</p>':`<button class="s" onclick="if(confirm('Report orders not received? The sender will be allowed to remove them.'))go('reportStuck',{b:'${b.id}'})">Orders not received</button>`):''}<button ${sc==n&&n?'':'disabled'} onclick="go('genOtp',{b:'${b.id}'})">${b.otp?'New OTP':'Generate OTP'}</button></div>`}).join('')||'<p class="m c">No incoming handovers.</p>'}
function chkView(){return `<div class="c"><h2>Check in at hub</h2><select id="ch">${opt(myHubs(),x=>`<option>${esc(x)}</option>`)}</select><select id="cm"></select><button id="ck">Check in</button></div>`}
function chkBind(){const f=()=>$('#cm').innerHTML=opt(me.people.filter(p=>p.role!='nurse'&&inHub(p,$('#ch').value)),p=>`<option value="${p.id}">${esc(p.name)} (${p.role})</option>`);$('#ch').onchange=()=>{f();put(keep())};f();$('#ck').onclick=async()=>{if(!$('#cm').value)return alert('No one tagged to this hub');if(await api('checkin',{hub:$('#ch').value,met:$('#cm').value}))alert('Checked in at '+new Date().toLocaleString());draw()}}
async function go(a,d){await api(a,d);draw()}
async function rm(b,o){await api('removeOrder',{b,order:o});draw()}
/* scanning: updates the screen instantly, saves to the sheet in batches in the background */
function addLocal(b,id){id=String(id).trim();if(!id)return{ok:0,msg:'Enter an order ID'};const x=data.out.find(y=>y.id==b);if(!x)return{ok:0,msg:'Batch not found'};if(x.orders.some(o=>o.id==id))return{ok:0,msg:'Already added'};x.orders.push({id,rs:false});queue('addOrders',b,id);return{ok:1}}
function recvLocal(b,id){id=String(id).trim();const x=data.inb.find(y=>y.id==b),o=x&&x.orders.find(o=>o.id==id);if(!o)return{ok:0,msg:'Not in this batch'};if(o.rs)return{ok:1,msg:'Already scanned'};o.rs=true;queue('recvScans',b,id);return{ok:1}}
function queue(a,b,id){const k=a+b;(Q[k]=Q[k]||{a,b,ids:[]}).ids.push(id);clearTimeout(qt);qt=setTimeout(flush,500)}
async function flush(){for(const k of Object.keys(Q)){const q=Q[k];delete Q[k];const r=await api(q.a,{b:q.b,orders:q.ids}),bad=r?(r.fail||[]).map(f=>f.order):q.ids;
if(bad.length){const bt=(q.a=='addOrders'?data.out:data.inb).find(y=>y.id==q.b);if(bt){if(q.a=='addOrders')bt.orders=bt.orders.filter(o=>bad.indexOf(o.id)<0);else bt.orders.forEach(o=>{if(bad.indexOf(o.id)>=0)o.rs=false})}if(r)msg=r.fail.map(f=>f.order+': '+f.err).join('; ')}}last='';draw()}
function typed(kind,b){const i=document.getElementById((kind=='a'?'o':'r')+b),x=kind=='a'?addLocal(b,i.value):recvLocal(b,i.value);if(x.ok)i.value='';else msg=x.msg;if(x.ok)msg='';draw()}
async function scan(kind,b){if(!('BarcodeDetector' in window))return alert('Camera scan is not supported in this browser. Type the order ID.');
let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return alert('Allow camera access to scan.')}
const d=document.createElement('div');d.className='c ov';d.innerHTML='<video autoplay playsinline muted></video><h2 id="sh"></h2><button id="sd">Done</button><div id="sl"></div>';document.body.append(d);
const v=d.querySelector('video');v.srcObject=s;const det=new BarcodeDetector(),seen={},list=[];let on=1;
const show=()=>{const bt=(kind=='a'?data.out:data.inb).find(y=>y.id==b),n=bt?bt.orders.length:0,sc=bt?bt.orders.filter(o=>o.rs).length:0;d.querySelector('#sh').textContent=kind=='a'?n+' scanned':sc+' of '+n+' scanned';
d.querySelector('#sl').innerHTML=list.map(x=>`<div class="o"><span>${esc(x.id)}</span><span class="${x.ok?'ok':'bad'}">${x.ok?(x.msg||'✓'):esc(x.msg)}</span></div>`).join('')};
const stop=()=>{on=0;s.getTracks().forEach(t=>t.stop());d.remove();draw()};d.querySelector('#sd').onclick=stop;show();
(async function L(){if(!on)return;try{for(const c of await det.detect(v)){const id=c.rawValue;if(seen[id]&&Date.now()-seen[id]<4000)continue;seen[id]=Date.now();const x=kind=='a'?addLocal(b,id):recvLocal(b,id);list.unshift({id,...x});navigator.vibrate&&navigator.vibrate(x.ok?60:[80,60,80]);show()}}catch(e){}setTimeout(L,250)})()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
T?start():login();
</script></body></html>
